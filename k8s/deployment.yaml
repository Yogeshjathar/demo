apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: springboot
    spec:
      containers:
        - name: springboot
          image: springboot-k8s-hello2:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
#          # Liveness probe: checks if the app is alive, restarts on failures
